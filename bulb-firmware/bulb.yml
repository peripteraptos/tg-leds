esphome:
  name: led-${device_number}
  on_boot:
    then:
      - output.set_level:
          id: blue_out
          level: 0.1%
      - output.set_level:
          id: blue_out
          level: 0%
      - light.turn_on:
          id: main_light
          effect: "Sync from Server"

bk72xx:
  board: generic-bk7231t-qfn32-tuya

ota:
  - platform: esphome
    password: ""

api:
  password: ""

wifi:
  ssid: "TP-Link_69E4"
  password: "79970341"
  power_save_mode: none
  # fast_connect: True
  #  reboot_timeout: "5min"

web_server:
  port: 80

packages:
  common: !include ./common.yml

# Example RGB outputs (PWM)
output:
  - platform: libretiny_pwm # Use 'libretiny_pwm' platform for LibreTiny (ESP8266)
    id: red_out
    pin: P7
    frequency: 500 Hz
  - platform: libretiny_pwm
    id: green_out
    pin: P8
    frequency: 500 Hz
  - platform: libretiny_pwm
    id: blue_out
    pin: P9
    frequency: 500 Hz
  - platform: libretiny_pwm
    id: white_out
    pin: P24
    frequency: 500 Hz

light:
  - platform: rgb
    id: main_light
    name: "LEDVANCE Light"
    red: red_out
    green: green_out
    blue: blue_out
    default_transition_length: 0.1s
    effects:
      - random:
      - pulse:
      - strobe:
      - light_sync:
          name: "Sync from Server"
          light_sync_id: ls
