  <body>
    <video width="100%" height="100%" id="video" hwz="on">
      <source src="video.mp4" />
    </video>

    <style>
      video {
        position: fixed;
        object-fit: contain;
        inset: 0;
      }
      html,
      body {

    <script>
      var sync = new BSSyncManager("domain1", "224.0.126.10", 1539);
      let fs = require("fs");
      let os = require("os");

      let fps = 24;
      let duration = null;
      let total_frames = null;
      let current_frame = 0;
      let current_frame_abs = 0;
      let loop_count = 0;
      let samplePath = "storage/sd/samples.json";
      let devices = [];
      let ip;
      let last_buffered_abs = 0;
      let last_sync_time = 0;
      let last_play_time = 0;

      sync.onsyncevent = function (e) {
        document
          .getElementById("video")
          .setSyncParams(e.domain, e.id, e.iso_timestamp);
        document.getElementById("video").load();
        document.getElementById("video").play();
        last_play_time = new Date(e.iso_timestamp).getTime();
        console.log(e.domain);
        console.log(e.id);
        console.log(e.iso_timestamp);
      };

      function restartLeader() {
        // Synchronize the videos to start playing in 1000ms
        sync.SetAsLeader(1);
        sync.Synchronize("sync_event1", 1000);
      }
      // restartLeader();

      const getIpAddress = () => {
        let address = os.networkInterfaces()["eth0"].filter((details) => {
          if (details.family === "IPv4" && !details.internal) {
            ip = details.address;
          }
        });
        if (address != null && address.length > 0) {
          ip = address[0].address;
        }
      };
      getIpAddress();
      setInterval(() => {
        if (!ip) {
          getIpAddress();
        }
      }, 5000);

      fs.readFile(samplePath, "utf8", (err, data) => {
        if (err) {
          console.log("Error reading samples file:", err);
          return;
        }
        devices = JSON.parse(data).map((samples, index) => ({
          id: index + 1,
          ip: null,
          last_sync_time: null,
          samples,
        }));
        console.log("Loaded devices:", devices);
      });

      let videoPlayer = document.getElementById("video");

      videoPlayer.addEventListener("loadedmetadata", (e) => {
        console.log("video loadedmetadata", e);
        duration = videoPlayer.duration;
        total_frames = Math.floor(duration * fps);
        console.log("Video duration:", duration);
        console.log("Total frames:", total_frames);
        console.log("Network interfaces:", os.networkInterfaces());
        console.log("Local IP address:", ip);
      });

      videoPlayer.addEventListener("ended", (e) => {
        console.log("video ended", e);
        restartLeader();
      });

      let bsSocketMessage = new BSDatagramSocket();
      bsSocketMessage.BindLocalPort(1235);
      bsSocketMessage.ondatagram = (e) => {
        let txtDec = new TextDecoder("utf-8");
        let txt = txtDec.decode(e.getBytes());
        let json = JSON.parse(txt);
        let sourceIp = e.remoteHost;
        let sourcePort = e.remotePort;

        // console.log("Received " + txtDec.decode(e.getBytes()));
        if (json.message?.toUpperCase() == "HELLO") {
          let lightId = json.id;
          let device = devices.find((d) => d.id == lightId);
          if (device) {
            device.ip = sourceIp;
          } else {
            console.log("Unknown device ID " + lightId);
          }
        }
      };

      setInterval(() => {
        bsSocketMessage.SendTo(
          "255.255.255.255",
          1234,
          JSON.stringify({
            message: "DISCOVER",
            total_frames: total_frames,
            ip,
            fps,
          })
        );
      }, 5000);

      let animation_frame = 0;

      function updateCurrentFrame() {
        let time = Date.now();
        if (time < last_play_time) {
          return 0; // not started yet
        }

        let elapsed = time - last_play_time;
        let expected_frame = Math.floor((elapsed / 1000) * fps);

        current_frame_abs = expected_frame;
        current_frame = expected_frame % total_frames;
      }

      async function bufferDevices() {
        let time = Date.now();
        let buffer_time = 5; // seconds
        let target_abs_frame = current_frame_abs + buffer_time * fps;
        // while (last_buffered_abs < target_abs_frame) {

        for (let device of devices) {
          if (device.ip) {
            if (device.last_sync_time < time - 2000) {
              updateCurrentFrame();
              bsSocketMessage.SendTo(
                device.ip,
                1234,
                JSON.stringify({
                  message: "SYNC",
                  frame: current_frame,
                })
              );
              device.last_sync_time = time;
            }

            for (let f = last_buffered_abs + 1; f <= target_abs_frame; f++) {
              let frame_index = f % total_frames;
              let { r, g, b } =
                device.samples[frame_index % device.samples.length];
              let message = JSON.stringify({
                message: "SAMPLES",
                f: frame_index,
                r,
                g,
                b,
              });
              bsSocketMessage.SendTo(device.ip, 1234, message);
            }
            // await sleep(5); // slight delay to avoid flooding
          }
        }
        last_buffered_abs = target_abs_frame;
        // await new Promise((r) => setTimeout(r, 100));
      }

      restartLeader();
      async function mainLoop() {
        while (true) {
          await new Promise((r) => requestAnimationFrame(r));
          await bufferDevices();
        }
      }
      function startMainLoop() {
        mainLoop().catch((err) => {
          console.error("Error in mainLoop:", err);
          setTimeout(startMainLoop, 1000); // Restart after 1 second
        });
      }
      startMainLoop();
